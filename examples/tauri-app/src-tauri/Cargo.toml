[package]
name = "rusk-example"
version = "0.1.0"
edition = "2021"
description = "Minimal Tauri 2 application used as the Rusk GUI reference app"
license = "MIT"
publish = false

# Detach from the repository workspace: examples build independently and pull
# in their own (larger) dependency tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
