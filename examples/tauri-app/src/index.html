<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rusk Example</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: #101418;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        text-align: center;
        user-select: none;
      }
      main { padding: 2rem; }
      h1 { font-size: 2.25rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { color: #8b949e; min-height: 1.5em; }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border: 1px solid #30363d;
        border-radius: 8px;
        background: #21262d;
        color: inherit;
        cursor: pointer;
      }
      button:active { background: #30363d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Rusk Example</h1>
      <p id="message">Waiting for the backend…</p>
      <button onclick="greet()">Ping backend</button>
    </main>
    <script>
      // withGlobalTauri exposes window.__TAURI__ without a bundler.
      async function greet() {
        try {
          const reply = await window.__TAURI__.core.invoke("greet", { name: "Rusk" });
          document.getElementById("message").textContent = reply;
        } catch (err) {
          document.getElementById("message").textContent = `Error: ${err}`;
        }
      }
      greet();
    </script>
  </body>
</html>
