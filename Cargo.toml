[workspace]
resolver = "2"
members = ["crates/kiosk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
repository = "https://github.com/example/rusk"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
